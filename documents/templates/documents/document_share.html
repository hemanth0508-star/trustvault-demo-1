<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Document - TrustVault</title>
    {% load static %}<link rel="stylesheet" href="{% static 'css/trustvault.css' %}">
</head>
<body class="tv-content-page">
    <h1>Share Document</h1>

    <h2>{{ document.title }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Permissions</button>
    </form>

    <p>
        <a href="{% url 'document_list' %}">Back to Documents</a>
    </p>
</body>
</html>
